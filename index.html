#topbar {

  z-index: 9999;
}

#url {

}

button {
  margin-left: 8px;
  height: 40px;
  border: none;
  border-radius: 10px;
  padding: 0 16px;
  cursor: pointer;
}

#frame {
  position: fixed;
  top: 52px;
  left: 0;
  width: 100vw;
  height: calc(100vh - 52px);
  border: none;
  background: white;
}
</style>
</head>
